<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" width="480" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161B27"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="360" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="40" x2="480" y2="40" stroke="#60A5FA" stroke-width="1"/>
    <line x1="0" y1="80" x2="480" y2="80" stroke="#60A5FA" stroke-width="1"/>
    <line x1="0" y1="120" x2="480" y2="120" stroke="#60A5FA" stroke-width="1"/>
    <line x1="0" y1="160" x2="480" y2="160" stroke="#60A5FA" stroke-width="1"/>
    <line x1="0" y1="200" x2="480" y2="200" stroke="#60A5FA" stroke-width="1"/>
    <line x1="0" y1="240" x2="480" y2="240" stroke="#60A5FA" stroke-width="1"/>
    <line x1="0" y1="280" x2="480" y2="280" stroke="#60A5FA" stroke-width="1"/>
    <line x1="0" y1="320" x2="480" y2="320" stroke="#60A5FA" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="360" stroke="#60A5FA" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="360" stroke="#60A5FA" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="360" stroke="#60A5FA" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="360" stroke="#60A5FA" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="360" stroke="#60A5FA" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="360" stroke="#60A5FA" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="360" stroke="#60A5FA" stroke-width="1"/>
  </g>

  <!-- Glow orb -->
  <circle cx="240" cy="180" r="130" fill="#3B82F6" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Editor window -->
  <rect x="60" y="50" width="360" height="260" rx="12" fill="#1A2035" stroke="#2D3A56" stroke-width="1.5"/>
  
  <!-- Titlebar -->
  <rect x="60" y="50" width="360" height="36" rx="12" fill="#1F2943"/>
  <rect x="60" y="74" width="360" height="12" fill="#1F2943"/>
  
  <!-- Window dots -->
  <circle cx="88" cy="68" r="6" fill="#FF5F57"/>
  <circle cx="108" cy="68" r="6" fill="#FFBD2E"/>
  <circle cx="128" cy="68" r="6" fill="#28C840"/>
  
  <!-- Filename tab -->
  <rect x="155" y="56" width="100" height="24" rx="4" fill="#0D1117" opacity="0.5"/>
  <text x="205" y="72" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#60A5FA" opacity="0.8">index.html</text>

  <!-- Line numbers -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#4B5563">
    <text x="80" y="113">01</text>
    <text x="80" y="133">02</text>
    <text x="80" y="153">03</text>
    <text x="80" y="173">04</text>
    <text x="80" y="193">05</text>
    <text x="80" y="213">06</text>
    <text x="80" y="233">07</text>
    <text x="80" y="253">08</text>
    <text x="80" y="273">09</text>
    <text x="80" y="293">10</text>
  </g>
  
  <!-- Divider -->
  <line x1="102" y1="86" x2="102" y2="310" stroke="#2D3A56" stroke-width="1"/>
  
  <!-- Code lines -->
  <!-- Line 1: <!DOCTYPE html> -->
  <text x="115" y="113" font-family="'Courier New', monospace" font-size="11" fill="#6B7280">&lt;!DOCTYPE html&gt;</text>
  
  <!-- Line 2: <html lang="ko"> -->
  <text x="115" y="133" font-family="'Courier New', monospace" font-size="11">
    <tspan fill="#60A5FA" filter="url(#glow)">&lt;html</tspan>
    <tspan fill="#F59E0B"> lang</tspan>
    <tspan fill="#6B7280">=</tspan>
    <tspan fill="#A3E635">"ko"</tspan>
    <tspan fill="#60A5FA" filter="url(#glow)">&gt;</tspan>
  </text>
  
  <!-- Line 3: <head> -->
  <text x="115" y="153" font-family="'Courier New', monospace" font-size="11">
    <tspan fill="#6B7280">  </tspan>
    <tspan fill="#60A5FA" filter="url(#glow)">&lt;head&gt;</tspan>
  </text>
  
  <!-- Line 4: <meta> -->
  <text x="115" y="173" font-family="'Courier New', monospace" font-size="11">
    <tspan fill="#6B7280">    </tspan>
    <tspan fill="#60A5FA">&lt;meta</tspan>
    <tspan fill="#F59E0B"> charset</tspan>
    <tspan fill="#6B7280">=</tspan>
    <tspan fill="#A3E635">"UTF-8"</tspan>
    <tspan fill="#60A5FA">/&gt;</tspan>
  </text>
  
  <!-- Line 5: </head> -->
  <text x="115" y="193" font-family="'Courier New', monospace" font-size="11">
    <tspan fill="#6B7280">  </tspan>
    <tspan fill="#60A5FA" filter="url(#glow)">&lt;/head&gt;</tspan>
  </text>
  
  <!-- Line 6: <body> -->
  <text x="115" y="213" font-family="'Courier New', monospace" font-size="11">
    <tspan fill="#6B7280">  </tspan>
    <tspan fill="#60A5FA" filter="url(#glow)">&lt;body&gt;</tspan>
  </text>
  
  <!-- Line 7: <main> with highlight -->
  <rect x="113" y="219" width="240" height="18" rx="2" fill="#3B82F6" opacity="0.12"/>
  <text x="115" y="233" font-family="'Courier New', monospace" font-size="11">
    <tspan fill="#6B7280">    </tspan>
    <tspan fill="#34D399" filter="url(#glow)">&lt;main</tspan>
    <tspan fill="#F59E0B"> role</tspan>
    <tspan fill="#6B7280">=</tspan>
    <tspan fill="#A3E635">"main"</tspan>
    <tspan fill="#34D399" filter="url(#glow)">&gt;</tspan>
  </text>
  
  <!-- Cursor blink -->
  <rect x="115" y="252" width="7" height="14" rx="1" fill="#60A5FA" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="115" y="263" font-family="'Courier New', monospace" font-size="11">
    <tspan fill="#6B7280">      </tspan>
  </text>
  
  <!-- Line 9: </main> -->
  <text x="115" y="273" font-family="'Courier New', monospace" font-size="11">
    <tspan fill="#6B7280">    </tspan>
    <tspan fill="#34D399">&lt;/main&gt;</tspan>
  </text>
  
  <!-- Line 10: </body> -->
  <text x="115" y="293" font-family="'Courier New', monospace" font-size="11">
    <tspan fill="#6B7280">  </tspan>
    <tspan fill="#60A5FA">&lt;/body&gt;</tspan>
  </text>

  <!-- Floating tag accent top-right -->
  <g filter="url(#glow)" opacity="0.6">
    <text x="390" y="40" font-family="'Courier New', monospace" font-size="20" fill="#818CF8">&lt;/&gt;</text>
  </g>
</svg>
